<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字员工工作台 — 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"PingFang SC"', '"Microsoft YaHei"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* 员工卡片浮动 */
    .emp-card { transition: all .15s ease; }
    .emp-card:hover { transform: translateY(-2px); }
    .emp-card.selected { box-shadow: 0 0 0 2px #3b82f6, 0 4px 12px rgba(59,130,246,.15); }

    /* 表格行 hover */
    .task-row { transition: background-color .1s ease; }
    .task-row:hover { background-color: #f8fafc; }
    .task-row.highlight { background-color: #fef3c7; }

    /* 子任务卡片呼吸 */
    @keyframes pulse-soft { 0%,100%{opacity:1} 50%{opacity:.6} }
    .pulse-soft { animation: pulse-soft 2s ease-in-out infinite; }

    /* 打字点 */
    @keyframes typing { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-4px);opacity:1} }
    .typing-dot { animation: typing 1.2s ease-in-out infinite; }
    .typing-dot:nth-child(2) { animation-delay: .15s; }
    .typing-dot:nth-child(3) { animation-delay: .3s; }

    /* 消息气泡渐入 */
    @keyframes msg-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .msg-in { animation: msg-in .25s ease-out; }

    /* 工单 chip */
    .ticket-chip { background:#dbeafe; color:#1d4ed8; padding:1px 6px; border-radius:4px; font-family:monospace; font-size:12px; cursor:pointer; }
    .ticket-chip:hover { background:#bfdbfe; }
  </style>
</head>
<body class="bg-slate-100 h-screen overflow-hidden">

<div class="h-screen flex flex-col p-3 gap-3">

  <!-- ==================== 顶部：待办/已办任务区 (20%) ==================== -->
  <section class="h-[20vh] min-h-[150px] rounded-xl bg-white shadow-sm border border-slate-200 flex flex-col">
    <!-- 头栏 -->
    <div class="flex items-center justify-between px-4 py-2 border-b border-slate-100">

        <button id="tab-todo" onclick="switchTodoView('todo')"
          class="px-3 py-1 text-sm font-medium rounded-md bg-blue-50 text-blue-700">待办 <span class="ml-1 text-xs px-1.5 rounded bg-blue-200">12</span></button>
        <button id="tab-done" onclick="switchTodoView('done')"
          class="px-3 py-1 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50">已办 <span class="ml-1 text-xs px-1.5 rounded bg-slate-200 text-slate-600">47</span></button>
      </div>
      <div class="flex items-center gap-2 text-sm text-slate-500">
        <button class="flex items-center gap-1 px-2 py-1 rounded hover:bg-slate-50">
          <span>全部系统</span>

        <div class="relative">

        </div>
        <button class="flex items-center gap-1 px-3 py-1 bg-blue-600 text-white text-sm rounded-md hover:bg-blue-700">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          新建任务
        </button>
      </div>
    </div>

    <!-- 业务系统 tabs -->
    <div class="flex items-center gap-1 px-4 pt-2 border-b border-slate-100">

      <button data-system="电网管理平台" onclick="filterSystem('电网管理平台')"
        class="sys-tab px-3 py-1.5 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-900">电网管理平台 <span class="ml-1 text-xs px-1.5 rounded-full bg-slate-100 text-slate-500">0</span></button>

    <!-- 任务表格 -->

            <th class="px-2 py-2 text-left font-medium w-32">处理员工</th>
            <th class="px-2 py-2 text-left font-medium w-16">时间</th>

    </div>

        </button>
        <button class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded" title="图片">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </button>
        <button class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded" title="语音">

        </button>

            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
          </button>
        </div>
      </div>
      <div id="suggestion-chips" class="flex flex-wrap gap-1.5"></div>
    </div>
  </section>

</div>

    { role:'user', text:'XX 风电场并网校核进度到哪了？' },
    { role:'assistant', avatar:'', name:'', text:'我来查一下…', typing:true },
    { role:'assistant', avatar:'', name:'', text:'', subtask:{ title:'查询 XX 风电场并网校核工单', status:'已完成', duration:'1.2s', result:'工单 #GN-2026-0415 当前状态：电气一次校核已完成，等待并网协议会签' } },
    { role:'assistant', avatar:'', name:'', text:'已查到：电气一次校核已完成（10/12），现在卡在"并网协议会签"环节，按并网政策需要先由你方盖章。预计 1 个工作日内可走完。' },
  ],
  cs: [
    { role:'assistant', avatar:'', name:'', text:'您好，我是客服数字员工。当前较忙（手上有 11 单），回复可能略有延迟。' },
  ],
  finance: [
    { role:'assistant', avatar:'', name:'', text:'您好，我是财务数字员工。对账差异、发票冲红、应收应付都可以问我。' },
  ],
  mkt: [
    { role:'assistant', avatar:'', name:'', text:'您好，我是营销数字员工。当前离线，留言后我会尽快回复。' },
  ],
};

// ==================== 状态 ====================
let currentView = 'todo';
let currentSystem = '订单系统';
let currentEmployee = 'dba';

// ==================== 渲染：任务表 ====================
function renderTasks() {
  const list = currentView === 'todo' ? TASKS_TODO : TASKS_DONE;
  const filtered = currentSystem === 'all' ? list : list.filter(t => t.system === currentSystem);
  const tbody = document.getElementById('task-table');
  tbody.innerHTML = '';
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-sm text-slate-400">🎉 ${currentView === 'todo' ? '本系统暂无待办' : '本系统暂无已办'}</td></tr>`;
    return;
  }
  filtered.forEach((t, idx) => {
    const assigneeEmp = EMPLOYEES.find(e => e.id === t.assignee);
    const tr = document.createElement('tr');
    tr.className = 'task-row cursor-pointer';
    tr.dataset.system = t.system;
    tr.onclick = () => onTaskClick(t);
    tr.innerHTML = `
      <td class="px-4 py-2 text-slate-400">${String(idx+1).padStart(2,'0')}</td>
      <td class="px-2 py-2 font-medium text-slate-900">${t.title}</td>
      <td class="px-2 py-2"><span class="sys-badge">${t.system}</span></td>
      <td class="px-2 py-2">${priorityBadge(t.priority)}</td>
      <td class="px-2 py-2">${statusBadge(t.status)}</td>
      <td class="px-2 py-2">${assigneeEmp ? assigneeCell(assigneeEmp) : '<span class="text-slate-400 text-xs">— 待分配</span>'}</td>
      <td class="px-2 py-2 text-xs text-slate-500">${t.time}</td>
    `;
    tbody.appendChild(tr);
  });
}

function priorityBadge(p) {
  const map = { P0:['red','P0'], P1:['orange','P1'], P2:['yellow','P2'], P3:['gray','P3'] };
  const [c, label] = map[p];
  const dotMap = { red:'#dc2626', orange:'#ea580c', yellow:'#ca8a04', gray:'#9ca3af' };
  return `<span class="inline-flex items-center gap-1 text-xs font-medium text-${c}-700"><span class="w-1.5 h-1.5 rounded-full" style="background:${dotMap[c]}"></span>${label}</span>`;
}

function statusBadge(s) {
  const map = {
    '处理中':['blue','bg-blue-50 text-blue-700'],
    '待分配':['gray','bg-slate-100 text-slate-600'],
    '已转交':['purple','bg-purple-50 text-purple-700'],
    '已升级':['red','bg-red-50 text-red-700'],
    '已完成':['green','bg-green-50 text-green-700'],
  };
  return `<span class="inline-block px-1.5 py-0.5 text-xs rounded ${map[s][1]}">${s}</span>`;
}

function assigneeCell(emp) {
  return `<div class="flex items-center gap-1.5"><span class="w-5 h-5 rounded-full bg-slate-100 flex items-center justify-center text-xs">${emp.avatar}</span><span class="text-xs text-slate-700">${emp.display_name}</span></div>`;
}

// ==================== 渲染：员工画廊 ====================
function renderEmployees() {
  const gallery = document.getElementById('employee-gallery');
  gallery.innerHTML = '';
  EMPLOYEES.forEach(emp => {
    const isSelected = emp.id === currentEmployee;
    const isSuper = emp.role === 'super';
    const card = document.createElement('div');
    card.className = `emp-card relative flex-shrink-0 cursor-pointer rounded-xl p-3 border ${isSelected ? 'selected border-blue-400 bg-blue-50/50' : 'border-slate-200 bg-white'} ${isSuper ? 'border-amber-300 bg-gradient-to-br from-amber-50 to-white' : ''}`;
    card.style.width = isSuper ? '200px' : '180px';
    card.onclick = () => onEmployeeClick(emp.id);
    card.innerHTML = `
      ${isSuper ? `<div class="absolute -top-2 left-3 px-2 py-0.5 bg-amber-500 text-white text-[10px] font-semibold rounded-full">总入口</div>` : ''}
      ${emp.id !== currentEmployee ? '' : '<div class="absolute -top-2 right-3 px-2 py-0.5 bg-blue-600 text-white text-[10px] font-medium rounded-full">正在对话</div>'}
      <div class="flex items-center gap-2 mb-2">
        <div class="relative">
          <div class="w-10 h-10 rounded-full ${isSuper ? 'bg-amber-100' : 'bg-slate-100'} flex items-center justify-center text-xl">${emp.avatar}</div>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white ${
            emp.status === 'online' ? 'bg-green-500' : emp.status === 'busy' ? 'bg-orange-500' : 'bg-slate-400'
          }"></span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-sm ${isSuper ? 'text-amber-900' : 'text-slate-900'} truncate">${emp.display_name}</div>
          <div class="text-[11px] text-slate-500 truncate">${emp.description.split('·')[0].trim()}</div>
        </div>
      </div>
      <div class="text-[11px] text-slate-500 leading-relaxed h-8 overflow-hidden">${emp.expertise}</div>
      <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-100">
        <span class="text-[11px] ${emp.todo_count > 0 ? 'text-orange-600' : 'text-slate-400'}">待办 ${emp.todo_count}</span>
        <button class="text-[11px] px-2 py-0.5 ${isSelected ? 'bg-blue-600 text-white' : 'border border-slate-300 text-slate-600 hover:border-blue-400 hover:text-blue-600'} rounded">
          ${isSelected ? '对话中' : '选用'}
        </button>
      </div>
    `;
    gallery.appendChild(card);
  });
}

// ==================== 渲染：聊天 ====================
function renderChat() {
  const emp = EMPLOYEES.find(e => e.id === currentEmployee);
  document.getElementById('chat-avatar').textContent = emp.avatar;
  document.getElementById('chat-name').textContent = emp.display_name + ' 数字员工';
  document.getElementById('chat-role').textContent = emp.description + ' · ' + emp.expertise;

  const statusMap = { online:['green-600','green-500','在线'], busy:['orange-600','orange-500','繁忙'], offline:['slate-500','slate-400','离线'] };
  const [tc, dc, label] = statusMap[emp.status];
  document.getElementById('chat-status').className = `flex items-center gap-1 text-xs text-${tc}`;
  document.getElementById('chat-status').innerHTML = `<span class="w-2 h-2 rounded-full bg-${dc}"></span>${label}`;

  // 消息
  const messages = document.getElementById('chat-messages');
  messages.innerHTML = '';
  const conv = CONVERSATIONS[currentEmployee] || [];
  conv.forEach(m => messages.appendChild(buildMessage(m)));
  messages.scrollTop = messages.scrollHeight;

  // 建议 chips
  const chips = document.getElementById('suggestion-chips');
  chips.innerHTML = '';
  (emp.suggestion || []).forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'px-2.5 py-1 text-xs bg-slate-100 text-slate-700 rounded-full hover:bg-blue-100 hover:text-blue-700';
    btn.textContent = '💡 ' + s;
    btn.onclick = () => {
      document.getElementById('chat-input').value = s;
      document.getElementById('chat-input').focus();
    };
    chips.appendChild(btn);
  });

  // 输入框禁用态
  const input = document.getElementById('chat-input');
  input.disabled = emp.status === 'offline';
  input.placeholder = emp.status === 'offline' ? `${emp.display_name} 当前离线，留言后会尽快回复…` : '输入消息… (Shift+Enter 换行)';
}

function buildMessage(m) {
  // 防御性回退：消息未带 name/avatar 时，用当前员工的 display_name/avatar
  const emp = EMPLOYEES.find(e => e.id === currentEmployee);
  const msgAvatar = m.avatar || (emp ? emp.avatar : '');
  const msgName   = m.name   || (emp ? emp.display_name : '');
  const wrap = document.createElement('div');
  wrap.className = 'flex gap-2 msg-in';
  if (m.role === 'user') {
    wrap.classList.add('justify-end');
    wrap.innerHTML = `
      <div class="max-w-[70%] px-3 py-2 bg-blue-600 text-white text-sm rounded-2xl rounded-tr-sm shadow-sm">
        ${escape(m.text)}
      </div>
      <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-sm flex-shrink-0">我</div>
    `;
  } else {
    let subtaskHtml = '';
    if (m.subtask) {
      const s = m.subtask;
      const statusColor = s.status === '已完成' ? 'text-green-600' : 'text-blue-600';
      subtaskHtml = `
        <div class="mt-2 p-2.5 bg-slate-50 border-l-4 border-blue-400 rounded-r text-xs">
          <div class="flex items-center gap-1.5 font-medium text-slate-800">🔧 子任务：${s.title}</div>
          <div class="mt-1 flex items-center gap-3 text-slate-500">
            <span class="${statusColor}">● ${s.status}</span>
            <span>用时 ${s.duration}</span>
          </div>
          <div class="mt-1 text-slate-600">${s.result}</div>
        </div>
      `;
    }
    const typingHtml = m.typing ? `
      <div class="mt-1 inline-flex items-center gap-1 text-slate-400">
        <span class="typing-dot w-1.5 h-1.5 rounded-full bg-current"></span>
        <span class="typing-dot w-1.5 h-1.5 rounded-full bg-current"></span>
        <span class="typing-dot w-1.5 h-1.5 rounded-full bg-current"></span>
      </div>` : '';

    wrap.innerHTML = `
      <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-sm flex-shrink-0">${msgAvatar}</div>
      <div class="max-w-[70%]">
        <div class="text-[11px] text-slate-500 mb-1">${msgName} · ${currentTimeStr()}</div>
        <div class="px-3 py-2 bg-slate-100 text-slate-900 text-sm rounded-2xl rounded-tl-sm">
          ${m.text || ''}
          ${typingHtml}
          ${subtaskHtml}
        </div>
      </div>
    `;
  }
  return wrap;
}

function escape(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function currentTimeStr() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ==================== 交互 ====================
function switchTodoView(view) {
  currentView = view;
  document.getElementById('tab-todo').className = `px-3 py-1 text-sm font-medium rounded-md ${view === 'todo' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'}`;
  document.getElementById('tab-done').className = `px-3 py-1 text-sm font-medium rounded-md ${view === 'done' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'}`;
  renderTasks();
}

function filterSystem(sys) {
  currentSystem = sys;
  document.querySelectorAll('.sys-tab').forEach(btn => {
    const isActive = btn.dataset.system === sys;
    btn.className = isActive
      ? 'sys-tab px-3 py-1.5 text-sm font-medium border-b-2 border-blue-600 text-blue-700'
      : 'sys-tab px-3 py-1.5 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-900';
  });
  renderTasks();
}

function onEmployeeClick(id) {
  currentEmployee = id;
  renderEmployees();
  renderChat();
}

function onTaskClick(task) {
  // 高亮该行
  document.querySelectorAll('.task-row').forEach(r => r.classList.remove('highlight'));
  event.currentTarget.classList.add('highlight');
  setTimeout(() => event.currentTarget.classList.remove('highlight'), 1500);

  // 切换到对应员工对话
  const targetEmp = SYSTEM_MAP[task.system] || 'super';
  if (currentEmployee !== targetEmp) {
    currentEmployee = targetEmp;
    renderEmployees();
    renderChat();
  }

  // 滚动到聊天底部
  setTimeout(() => {
    const cm = document.getElementById('chat-messages');
    cm.scrollTop = cm.scrollHeight;
  }, 100);
}

function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  const emp = EMPLOYEES.find(e => e.id === currentEmployee);
  if (emp.status === 'offline') return;

  const messages = document.getElementById('chat-messages');
  messages.appendChild(buildMessage({ role:'user', text }));
  input.value = '';
  messages.scrollTop = messages.scrollHeight;

  // 模拟员工回复
  setTimeout(() => {
    const replies = {
      super:'好的，我先理解一下问题，再为您分派最合适的专员。',
      oncall:'收到，我立即开始诊断。请稍候。',
      dba:'收到，正在调取相关系统日志进行分析…',
      sre:'收到，正在查询并网校核/审批系统…',
      cs:'好的，我已记录。请问还需要我做些什么？',
      finance:'收到，正在核对相关账目。',
      mkt:'收到，我会尽快处理。',
    };
    messages.appendChild(buildMessage({ role:'assistant', avatar:emp.avatar, name:emp.display_name, text:replies[currentEmployee] }));
    messages.scrollTop = messages.scrollHeight;
  }, 700);
}

// ==================== 启动 ====================
renderTasks();
renderEmployees();
renderChat();

// 输入框自动撑高
document.getElementById('chat-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Ctrl+Enter 发送
document.getElementById('chat-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
